<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --side:#eceef2; --text:#1d2330; --muted:#6b7280;
  --line:#d9dde3; --accent:#2563eb; --accent-soft:#dbe6fd; --done:#16a34a; --danger:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181d; --panel:#1c2027; --side:#11141a; --text:#e6e8eb; --muted:#9aa3ae;
    --line:#2c323b; --accent:#60a5fa; --accent-soft:#1e2a3d; --done:#4ade80; --danger:#f87171;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Yu Gothic UI",Meiryo,system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
#status{margin-left:auto;color:var(--muted);font-size:12px}
#status.dirty{color:var(--danger)}

.app{flex:1;display:flex;min-height:0}
aside{width:280px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
.side-head strong{font-size:13px}
#counter{color:var(--muted);font-size:12px}
.filters{display:flex;gap:4px;padding:0 12px 8px}
.filters button{flex:1;padding:3px 0;font-size:12px}
.filters button.on{background:var(--accent-soft);border-color:var(--accent)}
#list{list-style:none;margin:0;padding:0 6px;overflow-y:auto;flex:1}
.tab{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.tab:hover{background:var(--panel)}
.tab.active{background:var(--panel);border-color:var(--accent)}
.tab input[type=checkbox]{width:16px;height:16px;accent-color:var(--done);cursor:pointer;flex-shrink:0;margin:0}
.tab .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.done .name{text-decoration:line-through;color:var(--muted)}
.tab .rename-input{flex:1;min-width:0;font:inherit;padding:2px 4px;border:1px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--text)}
.tab .icon{border:none;background:none;padding:0 3px;color:var(--muted);visibility:hidden;font-size:13px}
.tab:hover .icon,.tab.active .icon{visibility:visible}
.tab .icon:hover{color:var(--accent)}
.tab .icon.del:hover{color:var(--danger)}
.side-foot{padding:10px 12px;border-top:1px solid var(--line)}
.side-foot button{width:100%}

main{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 20px;gap:12px;overflow:auto}
.title-row{display:flex;align-items:center;gap:12px}
#title{flex:1;min-width:0;font-family:inherit;font-size:20px;font-weight:600;line-height:1.3;color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px}
#title:hover{border-color:var(--line)}
#title:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.finish{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;user-select:none;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.finish input{width:18px;height:18px;accent-color:var(--done);margin:0;cursor:pointer}
.finish.on{border-color:var(--done);color:var(--done);font-weight:600}
label.lbl{font-size:12px;color:var(--muted);font-weight:600}
#notes{flex:1;min-height:240px;resize:vertical;width:100%;font-family:inherit;font-size:14px;line-height:1.6;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#notes:focus{outline:none;border-color:var(--accent)}
#meta{color:var(--muted);font-size:12px}
.empty{margin:auto;text-align:center;color:var(--muted)}
.hidden{display:none !important}

@media (max-width:700px){
  .app{flex-direction:column}
  aside{width:auto;max-height:45vh;border-right:none;border-bottom:1px solid var(--line)}
  main{padding:12px 16px}
}
</style>
</head>
<body>
<header>
  <h1>Task Tracker</h1>
  <button id="openBtn" title="Load tasks.json">Open JSON</button>
  <button id="saveBtn" class="primary" title="Ctrl+S">Save JSON</button>
  <button id="saveAsBtn">Save as…</button>
  <span id="status">Not linked to a file</span>
  <input type="file" id="fileInput" accept=".json,application/json" class="hidden">
</header>

<div class="app">
  <aside>
    <div class="side-head"><strong>Tasks</strong><span id="counter"></span></div>
    <div class="filters">
      <button data-f="all" class="on">All</button>
      <button data-f="open">Open</button>
      <button data-f="done">Finished</button>
    </div>
    <ul id="list"></ul>
    <div class="side-foot"><button id="addBtn">+ New task</button></div>
  </aside>

  <main>
    <div id="editor" class="hidden" style="display:flex;flex-direction:column;gap:12px;flex:1">
      <div class="title-row">
        <input id="title" placeholder="Task name" aria-label="Task name">
        <label class="finish" id="finishWrap"><input type="checkbox" id="finish"> Finished</label>
      </div>
      <label class="lbl" for="notes">Things to remember</label>
      <textarea id="notes" placeholder="Notes, deadlines, file paths, contacts…"></textarea>
      <div id="meta"></div>
    </div>
    <div id="empty" class="empty">
      <p>No task selected.</p>
      <p>Click <b>+ New task</b>, or <b>Open JSON</b> to load your <code>tasks.json</code>.</p>
    </div>
  </main>
</div>

<script>
const LS_KEY = 'taskTracker.v1';
const $ = id => document.getElementById(id);
const list = $('list'), titleEl = $('title'), notesEl = $('notes'), finishEl = $('finish');

let state = loadLocal() || { version: 1, activeId: null, tasks: [] };
let fileHandle = null, dirty = false, filter = 'all', saveTimer = null;

const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const now = () => new Date().toISOString();
const active = () => state.tasks.find(t => t.id === state.activeId) || null;

/* ---------- data ---------- */
function normalize(data) {
  const tasks = Array.isArray(data) ? data : (data && Array.isArray(data.tasks) ? data.tasks : null);
  if (!tasks) throw new Error('JSON must contain a "tasks" array.');
  const clean = tasks.map(t => ({
    id: String(t.id || uid()),
    name: String(t.name ?? 'Untitled'),
    done: !!t.done,
    notes: String(t.notes ?? ''),
    createdAt: t.createdAt || now(),
    updatedAt: t.updatedAt || now()
  }));
  const activeId = clean.some(t => t.id === data.activeId) ? data.activeId : (clean[0]?.id ?? null);
  return { version: 1, activeId, tasks: clean };
}
function loadLocal() {
  try { const s = localStorage.getItem(LS_KEY); return s ? normalize(JSON.parse(s)) : null; }
  catch { return null; }
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
}
function changed(task) {
  if (task) task.updatedAt = now();
  dirty = true;
  saveLocal();
  setStatus();
  if (fileHandle) { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveFile(false, true), 800); }
}

/* ---------- render ---------- */
function renderList() {
  list.innerHTML = '';
  const shown = state.tasks.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done));
  for (const t of shown) {
    const li = document.createElement('li');
    li.className = 'tab' + (t.id === state.activeId ? ' active' : '') + (t.done ? ' done' : '');

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.done; cb.title = 'Mark finished';
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => { t.done = cb.checked; changed(t); render(); };

    const name = document.createElement('span');
    name.className = 'name'; name.textContent = t.name || 'Untitled';
    name.title = 'Double-click to rename';
    name.ondblclick = e => { e.stopPropagation(); startRename(li, name, t); };

    const ren = iconBtn('✎', 'Rename', () => startRename(li, name, t));
    const del = iconBtn('✕', 'Delete', () => removeTask(t));
    del.classList.add('del');

    li.onclick = () => { state.activeId = t.id; saveLocal(); render(); };
    li.append(cb, name, ren, del);
    list.append(li);
  }
  const done = state.tasks.filter(t => t.done).length;
  $('counter').textContent = `${done}/${state.tasks.length} finished`;
}
function iconBtn(txt, title, fn) {
  const b = document.createElement('button');
  b.className = 'icon'; b.textContent = txt; b.title = title;
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}
function startRename(li, nameEl, t) {
  const inp = document.createElement('input');
  inp.className = 'rename-input'; inp.value = t.name;
  nameEl.replaceWith(inp); inp.focus(); inp.select();
  let finished = false;
  const finish = commit => {
    if (finished) return; finished = true;
    if (commit && inp.value.trim() && inp.value.trim() !== t.name) { t.name = inp.value.trim(); changed(t); }
    render();
  };
  inp.onclick = e => e.stopPropagation();
  inp.onkeydown = e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  inp.onblur = () => finish(true);
}
function renderEditor() {
  const t = active();
  $('editor').classList.toggle('hidden', !t);
  $('empty').classList.toggle('hidden', !!t);
  if (!t) return;
  if (document.activeElement !== titleEl) titleEl.value = t.name;
  if (document.activeElement !== notesEl) notesEl.value = t.notes;
  finishEl.checked = t.done;
  $('finishWrap').classList.toggle('on', t.done);
  $('meta').textContent = `Created ${fmt(t.createdAt)} · Updated ${fmt(t.updatedAt)}`;
}
const fmt = iso => new Date(iso).toLocaleString();
function render() { renderList(); renderEditor(); }
function setStatus(msg) {
  const s = $('status');
  if (msg) { s.textContent = msg; s.classList.remove('dirty'); return; }
  const where = fileHandle ? fileHandle.name : 'browser only';
  s.textContent = dirty ? `Unsaved changes (${where})` : `Saved · ${where}`;
  s.classList.toggle('dirty', dirty);
}

/* ---------- actions ---------- */
function addTask() {
  const t = { id: uid(), name: 'New task ' + (state.tasks.length + 1), done: false, notes: '', createdAt: now(), updatedAt: now() };
  state.tasks.push(t); state.activeId = t.id;
  if (filter === 'done') setFilter('all');
  changed(); render();
  const li = list.querySelector('.tab.active');
  if (li) startRename(li, li.querySelector('.name'), t);
}
function removeTask(t) {
  if (!confirm(`Delete "${t.name}"?`)) return;
  const i = state.tasks.indexOf(t);
  state.tasks.splice(i, 1);
  if (state.activeId === t.id) state.activeId = (state.tasks[i] || state.tasks[i - 1] || {}).id ?? null;
  changed(); render();
}
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  renderList();
}

titleEl.oninput = () => { const t = active(); if (!t) return; t.name = titleEl.value; changed(t); renderList(); };
notesEl.oninput = () => { const t = active(); if (!t) return; t.notes = notesEl.value; changed(t); };
finishEl.onchange = () => { const t = active(); if (!t) return; t.done = finishEl.checked; changed(t); render(); };
$('addBtn').onclick = addTask;
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => setFilter(b.dataset.f));

/* ---------- JSON file ---------- */
const PICK = { types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] };

async function openFile() {
  if (!window.showOpenFilePicker) return $('fileInput').click();
  try {
    const [h] = await showOpenFilePicker(PICK);
    applyLoaded(await (await h.getFile()).text(), h);
  } catch (e) { if (e.name !== 'AbortError') alert('Could not open file: ' + e.message); }
}
$('fileInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  applyLoaded(await f.text(), null);
  e.target.value = '';
};
function applyLoaded(text, handle) {
  try {
    state = normalize(JSON.parse(text));
    fileHandle = handle; dirty = false;
    saveLocal(); render(); setStatus();
  } catch (e) { alert('Invalid tasks file: ' + e.message); }
}
async function saveFile(saveAs, auto) {
  const json = JSON.stringify(state, null, 2);
  if (!window.showSaveFilePicker) {
    if (auto) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'tasks.json'; a.click(); URL.revokeObjectURL(a.href);
    dirty = false; setStatus('Downloaded tasks.json');
    return;
  }
  try {
    if (!fileHandle || saveAs) fileHandle = await showSaveFilePicker({ ...PICK, suggestedName: 'tasks.json' });
    const w = await fileHandle.createWritable();
    await w.write(json); await w.close();
    dirty = false; setStatus();
  } catch (e) { if (e.name !== 'AbortError') alert('Could not save: ' + e.message); }
}
$('openBtn').onclick = openFile;
$('saveBtn').onclick = () => saveFile(false);
$('saveAsBtn').onclick = () => saveFile(true);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(e.shiftKey); }
});

render();
setStatus(state.tasks.length ? 'Restored from browser · open tasks.json to link the file' : 'Not linked to a file');
</script>
</body>
</html>
